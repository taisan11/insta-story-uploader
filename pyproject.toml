[project]
name = "insta-story-uploader"
version = "0.1.0"
description = "Instagram Story Uploader with GUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "instagrapi==3.2.3",
    "opencv-python>=4.12.0.88",
    "pillow>=13.0.0,<14",
    "imageio-ffmpeg>=0.6.0",
    "pydantic>=2.12.5,<2.15",
]

[dependency-groups]
build = ["pyinstaller>=6.17.0,<7"]
